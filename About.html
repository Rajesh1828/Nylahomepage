    .carousel-caption {

    top: 50%;
    transform: translateY(-50%);

    text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
}

.typewriter {
    overflow: hidden;
    white-space: nowrap;
    font-weight: 4rem; /* Increase font weight (e.g., 700 for bold) */
    border-right: 2px solid white; /* Cursor effect */
    animation: typing 6s steps(30, end), blink 0.5s step-end infinite;
}

@keyframes typing {
    from { width: 0; }
    to { width: 100%; }
}

@keyframes blink {
    from { border-color: transparent; }
    to { border-color: white; }
}

#head{
    font-size: 4rem; /* Adjust size if needed */
    color: #ffffff; /* Change color to your preference */
    font-family: 'Poppins', sans-serif;
    text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);

}


.preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #FB9EC6;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preloader img {
            width: 100px; /* Adjust size as needed */
            height: auto;
        }

        .preloader.hidden {
            animation: fadeOut 2s ease;
            animation-fill-mode: forwards;
        }

        @keyframes fadeOut {
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
