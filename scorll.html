<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Scrolling Announcement Bar</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .announcement-bar {
            background-color: #ffc107; /* Bright yellow background */
            color: #000; /* Black text */
            white-space: nowrap;
            overflow: hidden;
            position: relative;
            height: 60px; /* Increased height */
            display: flex;
            align-items: center; /* Vertically center the content */
            justify-content: space-between; /* Space between text and button */
            padding: 0 20px; /* Add horizontal padding */
        }

        .scrolling-text {
            display: inline-block;
            position: absolute;
            white-space: nowrap;
            animation: scroll-left 20s linear infinite;
        }

        @keyframes scroll-left {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(-100%);
            }
        }
    </style>
</head>
<body>

<div class="announcement-bar">
    <div class="container d-flex align-items-center position-relative">
        <!-- Scrolling text -->
        <div class="scrolling-text">
            <strong>Free ₹50,000 Today Offer! Grab it now! Limited Time Only!</strong>
          
       
        </div>
        <!-- Button on the right -->
        <a href="#" class="btn btn-dark btn-sm ms-auto">Shop Now</a>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
